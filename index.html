<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince verma| Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MAIN WRAPPER -->
<div class="main-container">

    <!-- ================= TOP HUD ================= -->
    <header class="top-bar">

        <div class="left-hud">
            <div class="portfolio-name">PRINCE VERMA | PORTFOLIO</div>
        </div>

        <div class="right-hud">
             <button class="view-btn">DOWNLOAD CV</button>
            <button class="view-btn">DOWNLOAD RESUME</button>
           
        </div>

    </header>

    <!-- ================= CONTENT AREA ================= -->
    <div class="content-area">

        <!-- LEFT PROFILE PANEL -->
        <aside class="left-panel">
            <div class="profile-card">
                <div class="profile-img"></div>
                <div class="username">PRINCE VERMA</div>
                <div class="player-id">AGE 20</div>
            </div>

            <div class="season-card">
                BCA 3RD YEAR
            </div>
        </aside>

        <!-- CENTER CHARACTER AREA -->
        <section class="character-section">
            <div class="character-image">
                <!-- background character image via CSS -->
            </div>
        </section>


        
        <!-- FEATURED WORKS PANEL -->
        <section class="works-panel">

            <div class="works-header">
                PROJECTS
            </div>

            <div class="projects-grid">

                <div class="project-card">
                    <div class="project-thumbnail"></div>
                    <div class="project-title">Survival Guide App</div>
                    <div class="project-desc">
                        UI/UX Case Study – Survival Guide App
                    </div>
                    <button class="view-btn">VIEW PROJECT</button>
                </div>

                <div class="project-card">
                    <div class="project-thumbnail"></div>
                    <div class="project-title">E-Sports Event Layout</div>
                    <div class="project-desc">
                        Graphic Design – E-Sports Event Layout
                    </div>
                    <button class="view-btn">VIEW PROJECT</button>
                </div>

                <div class="project-card">
                    <div class="project-thumbnail"></div>
                    <div class="project-title">Match Highlights Reel</div>
                    <div class="project-desc">
                        Video Editing – Match Highlights Reel
                    </div>
                    <button class="view-btn">VIEW PROJECT</button>
                </div>

                <div class="project-card">
                    <div class="project-thumbnail"></div>
                    <div class="project-title">Map Design Concept</div>
                    <div class="project-desc">
                        Game Dev – Map Design Concept
                    </div>
                    <button class="view-btn">VIEW PROJECT</button>
                </div>

            </div>

        </section>

<!--preview -->
<div class="modal" id="projectModal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <div class="modal-body"></div>
    </div>
</div>


        <!-- RIGHT MENU -->
       <aside class="right-menu">
    <button class="menu-btn home-btn" data-section="home">HOME</button>
    <button class="menu-btn" data-section="about">ABOUT ME</button>
    <button class="menu-btn active" data-section="projects">PROJECTS</button>
    <button class="menu-btn" data-section="certificates">CERTIFICATES</button>
    <button class="menu-btn" data-section="resume">RESUME</button>
    <button class="menu-btn" data-section="contact">CONTACT</button>
</aside>

    </div>

    <!-- BOTTOM READY BUTTON -->
    <div class="ready-section">
        <button class="ready-btn">READY – PORTFOLIO LIVE</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
